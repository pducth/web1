<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Table</title>
    <style>
        table {
            width: 350px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #aaa;
        }

        tr.selected {
            background-color: red;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="clock"></div>
    <p id="mouse-message">Click chuột vào dòng này. Sẽ xuất hiện thông báo phím bấm của chuột</p>

    <table id="data-table">
        <tbody>
            <tr><td>Thêm dòng mới ở đây</td><td>Thêm dòng mới ở đây</td></tr>
            <tr><td>Thêm dòng mới ở đây</td><td>Thêm dòng mới ở đây</td></tr>
            <tr><td>Thêm dòng mới ở đây</td><td>Thêm dòng mới ở đây</td></tr>
            <tr><td>Dòng 1 cột 1</td><td>Dòng 1 cột 2</td></tr>
            <tr><td>Dòng 2 cột 1</td><td>Dòng 2 cột 2</td></tr>
            <tr><td>Dòng 3 cột 1</td><td>Dòng 3 cột 2</td></tr>
        </tbody>
    </table>
    <br>
    <button type="button" id="add-button">Thêm vào</button>
    <button type="button" id="delete-button">Xóa</button>
    <button type="button" id="row-button">Chỉ hiện dòng</button>
    <button type="button" id="column-button">Chỉ hiện cột</button>
    <button type="button" id="open-button">Mở một trang mới</button>

    <script>
        const clock = document.getElementById("clock");
        const mouseMessage = document.getElementById("mouse-message");
        const tableBody = document.querySelector("#data-table tbody");
        let rowsFiltered = false;
        let visibleColumn = null;

        function updateClock() {
            clock.textContent = new Date().toLocaleTimeString("vi-VN", {
                hour12: false
            });
        }

        function showMouseButton(event) {
            event.preventDefault();
            alert(event.button === 2 ? "Chuột phải" : "Chuột trái");
        }

        function toggleRow(event) {
            if (event.target.closest("td")) {
                event.currentTarget.classList.toggle("selected");
            }
        }

        function addRow() {
            const row = tableBody.insertRow();
            row.insertCell().textContent = "Thêm dòng mới ở đây";
            row.insertCell().textContent = "Thêm dòng mới ở đây";
            row.addEventListener("click", toggleRow);
            row.classList.toggle("hidden", rowsFiltered);
            if (visibleColumn !== null) {
                updateColumnVisibility();
            }
        }

        function deleteSelectedRows() {
            tableBody.querySelectorAll("tr.selected").forEach(row => row.remove());
        }

        function showSelectedRows() {
            rowsFiltered = !rowsFiltered;
            tableBody.querySelectorAll("tr").forEach(row => {
                row.classList.toggle("hidden", rowsFiltered && !row.classList.contains("selected"));
            });
        }

        function updateColumnVisibility() {
            tableBody.querySelectorAll("tr").forEach(row => {
                Array.from(row.cells).forEach((cell, index) => {
                    cell.classList.toggle("hidden", visibleColumn !== null && index !== visibleColumn);
                });
            });
        }

        function showSelectedColumn() {
            if (visibleColumn !== null) {
                visibleColumn = null;
                updateColumnVisibility();
                return;
            }

            const column = prompt("Nhập số cột muốn hiển thị (1 hoặc 2):");
            if (column === null) {
                return;
            }
            if (column !== "1" && column !== "2") {
                alert("Vui lòng nhập 1 hoặc 2.");
                return;
            }
            visibleColumn = Number(column) - 1;
            updateColumnVisibility();
        }

        function openNewPage() {
            window.open("https://tranduythanh.com", "_blank");
        }

        updateClock();
        setInterval(updateClock, 1000);
        mouseMessage.addEventListener("click", showMouseButton);
        mouseMessage.addEventListener("contextmenu", showMouseButton);
        tableBody.querySelectorAll("tr").forEach(row => row.addEventListener("click", toggleRow));
        document.getElementById("add-button").addEventListener("click", addRow);
        document.getElementById("delete-button").addEventListener("click", deleteSelectedRows);
        document.getElementById("row-button").addEventListener("click", showSelectedRows);
        document.getElementById("column-button").addEventListener("click", showSelectedColumn);
        document.getElementById("open-button").addEventListener("click", openNewPage);
    </script>
</body>
</html>
